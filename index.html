<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>アンカー距離計算</title>
<style>
@media print {
  html, body { min-height:0 !important; height:auto !important; background:#fff; padding:4px; font-family:'Courier New',monospace; }
  .no-print { display:none !important; }
  .card { border:1px solid #ccc; border-radius:0; padding:12px; margin-bottom:8px; break-inside:avoid; }
  .print-only { display:block !important; }
  #print-canvas-wrap { display:block !important; }
  #step3 { display:none !important; }
  #print-page1 { page-break-after:always !important; break-after:page !important; }
  #print-page2 { page-break-before:always !important; break-before:page !important; }
  #print-canvas-wrap { page-break-inside:avoid !important; break-inside:avoid !important; }
  #print-canvas-wrap canvas { max-width:100% !important; max-height:82vh !important; height:auto !important; display:block; }
  h1 { font-size:18px; }
  .subtitle { font-size:11px; }
  .sec { font-size:11px; }
  th, td { font-size:12px; padding:5px 7px; }
  td.diag { font-size:13px; }
  .footer { display:none !important; }
}
</style>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#F5F4F0; --surface:#FFFFFF; --border:#E0DDD6;
  --primary:#1A1A1A; --accent:#E85D26; --muted:#8A8680;
  --row:#FAFAF8; --blue:#2563EB; --preview:#CBD5E1;
  --selected:#F59E0B; --measure:#7C3AED;
}
body { background:var(--bg); font-family:'DM Mono','Courier New',monospace; padding:16px; min-height:100vh; padding-bottom:40px; }
h1 { font-size:26px; font-weight:700; color:var(--primary); }
.subtitle { font-size:14px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:0.5px; }
.header { margin-bottom:20px; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:12px; }
.sec { font-size:13px; font-weight:700; color:var(--muted); letter-spacing:1.5px; text-transform:uppercase; margin-bottom:14px; }
.row { display:flex; gap:8px; }
.ig { display:flex; flex-direction:column; flex:1; }
label { font-size:14px; color:var(--muted); margin-bottom:6px; display:block; }
input[type=number] { border:1.5px solid var(--border); border-radius:8px; padding:12px 14px; font-size:18px; font-family:inherit; color:var(--primary); background:var(--bg); outline:none; width:100%; }
input[type=number]:focus { border-color:var(--accent); }
.count-note { font-size:14px; color:var(--muted); margin-top:10px; }
.count-note strong { color:var(--primary); }
.btn { display:block; width:100%; padding:14px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px; font-family:inherit; }
.btn-save { flex:1; padding:12px; background:#16A34A; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-save:active { opacity:0.8; }
.btn-reset { flex:1; padding:12px; background:#fff; color:#E85D26; border:1.5px solid #E85D26; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; }
.btn-reset:active { opacity:0.8; }
.save-msg { font-size:13px; margin-top:8px; text-align:center; }
.btn-outline { background:none; border:1px solid var(--measure); color:var(--measure); border-radius:6px; padding:6px 12px; font-size:14px; cursor:pointer; font-family:inherit; }
.canvas-hint { font-size:13px; color:var(--muted); margin-bottom:8px; }
.canvas-container { position:relative; border-radius:8px; border:1px solid var(--border); overflow:hidden; background:#FAFAF8; touch-action:none; }
.canvas-container.preview { border-color:var(--preview); }
canvas { display:block; width:100%; height:100%; }
.zoom-hint { position:absolute; bottom:6px; right:8px; font-size:11px; color:var(--muted); pointer-events:none; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:8px; }
.measure-banner { margin-top:10px; padding:12px 16px; border-radius:8px; background:#F3F0FF; border:1.5px solid var(--measure); display:flex; justify-content:space-between; align-items:center; }
.measure-text { font-size:16px; font-weight:700; color:var(--measure); }
.select-hint { margin-top:8px; font-size:14px; color:var(--muted); text-align:center; }
.select-hint span { color:var(--selected); font-weight:700; }
details { margin-top:14px; }
summary { font-size:14px; color:var(--muted); cursor:pointer; user-select:none; padding:4px 0; }
.text-inputs { margin-top:10px; }
.space-group { margin-bottom:12px; }
.space-group-title { font-size:14px; font-weight:700; color:var(--primary); margin-bottom:8px; display:block; }
.space-item { margin-bottom:8px; }
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; }
th { background:var(--row); border:1px solid var(--border); padding:10px 12px; color:var(--muted); font-weight:700; font-size:14px; text-align:center; }
td { border:1px solid var(--border); padding:10px 12px; text-align:center; color:var(--primary); font-size:16px; background:var(--surface); }
td.diag { color:var(--accent); font-weight:700; font-size:18px; background:#FEF5F0; }
td.self { color:var(--muted); background:var(--row); }
.table-note { font-size:13px; color:var(--muted); margin-top:10px; }
.footer { text-align:center; color:var(--muted); font-size:13px; margin-top:8px; }
.hidden { display:none !important; }
#popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; align-items:center; justify-content:center; z-index:100; }
.popup-box { background:var(--surface); border-radius:14px; padding:20px; width:280px; box-shadow:0 8px 32px rgba(0,0,0,0.18); border:1px solid var(--border); }
.popup-title { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:8px; letter-spacing:1px; text-transform:uppercase; }
.popup-label { font-size:14px; color:var(--primary); margin-bottom:12px; }
.popup-input-row { display:flex; gap:8px; align-items:center; }
#popup-input { flex:1; border:1.5px solid var(--accent); border-radius:8px; padding:10px 12px; font-size:18px; font-family:inherit; color:var(--primary); background:var(--bg); outline:none; }
.popup-unit { color:var(--muted); font-size:14px; }
.popup-btn { margin-top:12px; width:100%; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
</style>
</head>
<body>

<div id="popup-overlay" class="hidden">
  <div class="popup-box">
    <div class="popup-title">間隔を入力</div>
    <div class="popup-label" id="popup-label"></div>
    <div class="popup-input-row">
      <input type="number" inputmode="decimal" placeholder="例: 500" id="popup-input">
      <span class="popup-unit">mm</span>
    </div>
    <button class="popup-btn" id="popup-ok">確定</button>
  </div>
</div>

<div class="header">
  <h1>アンカー距離計算</h1>
  <p class="subtitle">Anchor Distance Calculator · mm</p>
</div>

<div class="card no-print">
  <div class="sec">① アンカー数を指定</div>
  <div class="row">
    <div class="ig">
      <label>横（列）の本数</label>
      <input type="number" inputmode="numeric" min="1" max="10" id="cols-input" value="2">
    </div>
    <div class="ig">
      <label>縦（行）の本数</label>
      <input type="number" inputmode="numeric" min="1" max="10" id="rows-input" value="2">
    </div>
  </div>
  <p class="count-note">合計 <strong id="total-count">4</strong>本（入力後に別の場所をタップで反映）</p>
</div>

<div class="card no-print">
  <div class="sec">② 配置図・間隔入力</div>
  <div class="canvas-hint">
    <span id="preview-hint" class="hidden" style="font-style:italic">※ プレビュー（未入力は仮100mm）</span>
    <span>線タップ→間隔入力　点タップ→距離測定　2本指→ズーム</span>
  </div>
  <div class="canvas-container preview" id="canvas-container-2" style="height:340px;width:100%;display:block">
    <canvas id="canvas-2" style="width:100%;height:340px;display:block"></canvas>
    <span class="zoom-hint" id="zoom-hint-2"></span>
  </div>
  <div class="legend">
    <span><span style="color:var(--blue)">─</span> 隣接距離</span>
    <span><span style="color:var(--accent)">╌</span> 隣接対角</span>
    <span><span style="color:var(--measure)">╌</span> 測定距離</span>
  </div>
  <div id="measure-banner-2" class="measure-banner hidden">
    <span class="measure-text" id="measure-text-2"></span>
    <button class="btn-outline" id="clear-btn-2">クリア</button>
  </div>
  <div id="select-hint-2" class="select-hint hidden">
    <span id="select-name-2"></span> を選択中 — 2点目をタップ
  </div>
  <details id="text-details">
    <summary>▶ テキストで入力する（タップで開く）</summary>
    <div class="text-inputs" id="text-inputs"></div>
  </details>
  <button class="btn hidden" id="calc-btn">計算する →</button>
</div>

<div class="card hidden no-print" id="step3">
  <div class="sec">③ 全アンカー間距離（mm）</div>
  <div class="table-wrap"><table id="dist-table"></table></div>
  <p class="table-note">※ オレンジ色が対角距離</p>
</div>

<div class="card no-print" style="margin-top:4px">
  <div class="row" style="gap:8px">
    <button class="btn-save" id="save-btn">💾 保存</button>
    <button class="btn-reset" id="reset-btn">🗑 リセット</button>
  </div>
  <button class="btn" id="print-btn" style="background:#1A1A1A;margin-top:8px">🖨 PDF・印刷</button>
  <p id="save-msg" class="save-msg hidden"></p>
</div>

<!-- 印刷専用エリア（画面では非表示） -->
<div id="print-area" class="print-only" style="display:none">
  <!-- 1ページ目：図 -->
  <div id="print-page1" style="page-break-after:always;break-after:page;">
    <div style="margin-bottom:8px">
      <strong id="print-title" style="font-size:16px"></strong>
      <span id="print-date" style="font-size:11px;color:#666;margin-left:12px"></span>
    </div>
    <div id="print-canvas-wrap" style="margin-bottom:8px;border:1px solid #ccc;display:inline-block"></div>
  </div>
  <!-- 2ページ目：表 -->
  <div id="print-page2">
    <div style="margin-bottom:8px">
      <strong id="print-title2" style="font-size:16px"></strong>
      <span id="print-date2" style="font-size:11px;color:#666;margin-left:12px"></span>
    </div>
    <div id="print-table-wrap"></div>
  </div>
</div>

<p class="footer no-print">オフライン対応 · 外部通信なし</p>

<script>
// ============================================================
// 状態
// ============================================================
var cols=2, rows=2;
var colSpaces=[""], rowSpaces=[""];
var confirmed=false;
var selectedAnchors=[];
var measurePair=null;
var popupTarget=null;
var COLORS=["#E85D26","#2563EB","#16A34A","#9333EA","#D97706","#0891B2","#BE185D","#65A30D"];

// viewport状態：ワールド座標系の表示範囲を管理
// panX/panY = ワールド座標の中心点、zoom = px/mm相当のスケール
var vpZoom=1, vpPanX=0, vpPanY=0;
var vpInited=false; // 初回のみfit

// ============================================================
// 計算
// ============================================================
function calcDist(a,b){ return Math.sqrt((b.x-a.x)*(b.x-a.x)+(b.y-a.y)*(b.y-a.y)); }
function anchorName(c,r){ return String.fromCharCode(65+c)+(r+1); }

function buildAnchors(){
  var xPos=[0];
  for(var i=0;i<cols-1;i++){var v=parseFloat(colSpaces[i]);xPos.push(xPos[i]+(isNaN(v)||v<=0?100:v));}
  var yPos=[0];
  for(var j=0;j<rows-1;j++){var v=parseFloat(rowSpaces[j]);yPos.push(yPos[j]+(isNaN(v)||v<=0?100:v));}
  var list=[];
  for(var r=0;r<rows;r++) for(var c=0;c<cols;c++)
    list.push({id:r+"-"+c,name:anchorName(c,r),x:xPos[c],y:yPos[r],color:COLORS[(r*cols+c)%8],col:c,row:r});
  return list;
}

function isReady(){
  var cs=cols>1?colSpaces.map(function(v){return parseFloat(v);}):[];
  var rs=rows>1?rowSpaces.map(function(v){return parseFloat(v);}):[];
  return cs.every(function(v){return !isNaN(v)&&v>0;})&&rs.every(function(v){return !isNaN(v)&&v>0;});
}

function ptSegDist(px,py,ax,ay,bx,by){
  var dx=bx-ax,dy=by-ay,len=dx*dx+dy*dy;
  if(len===0) return Math.sqrt((px-ax)*(px-ax)+(py-ay)*(py-ay));
  var t=Math.max(0,Math.min(1,((px-ax)*dx+(py-ay)*dy)/len));
  return Math.sqrt((px-(ax+t*dx))*(px-(ax+t*dx))+(py-(ay+t*dy))*(py-(ay+t*dy)));
}

// ワールド座標 → キャンバスピクセル座標
function worldToCanvas(wx,wy,W,H){
  return { cx: W/2 + (wx - vpPanX)*vpZoom, cy: H/2 + (wy - vpPanY)*vpZoom };
}
// キャンバスピクセル → ワールド座標
function canvasToWorld(cx,cy,W,H){
  return { x: (cx - W/2)/vpZoom + vpPanX, y: (cy - H/2)/vpZoom + vpPanY };
}

// アンカーのワールド座標の中心にviewportを合わせてfitする
function fitViewport(anchors, W, H){
  if(!anchors||anchors.length===0) return;
  var xs=anchors.map(function(a){return a.x;}), ys=anchors.map(function(a){return a.y;});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  vpPanX=(minX+maxX)/2; vpPanY=(minY+maxY)/2;
  var rangeX=maxX-minX||200, rangeY=maxY-minY||200;
  var PAD=80;
  var zx=(W-PAD*2)/rangeX, zy=(H-PAD*2)/rangeY;
  vpZoom=Math.min(zx,zy);
  // 最小間隔を140px保証
  var minSpX=cols>1?rangeX/(cols-1):rangeX;
  var minSpY=rows>1?rangeY/(rows-1):rangeY;
  var minSp=Math.min(minSpX,minSpY);
  var minZ=140/minSp;
  if(vpZoom<minZ) vpZoom=minZ;
}

// 印刷専用fit（最小間隔保証なし・Canvas内に必ず収める）
// PAD_L/R/T/B: 左右上下の非対称パディング（右側に縦寸法ラベル分を確保）
function fitViewportForPrint(anchors, W, H, padL, padR, padT, padB){
  if(!anchors||anchors.length===0) return;
  padL=padL||20; padR=padR||20; padT=padT||20; padB=padB||20;
  var xs=anchors.map(function(a){return a.x;}), ys=anchors.map(function(a){return a.y;});
  var minX=Math.min.apply(null,xs), maxX=Math.max.apply(null,xs);
  var minY=Math.min.apply(null,ys), maxY=Math.max.apply(null,ys);
  var rangeX=maxX-minX||1, rangeY=maxY-minY||1;
  var drawW=W-padL-padR, drawH=H-padT-padB;
  var zx=drawW/rangeX, zy=drawH/rangeY;
  vpZoom=Math.min(zx,zy);
  // パン中心をパディングを考慮した描画領域の中心に合わせる
  var centerX=padL+(drawW/2), centerY=padT+(drawH/2);
  vpPanX=(minX+maxX)/2;
  vpPanY=(minY+maxY)/2;
  // worldToCanvasが W/2,H/2 基準なので、描画領域中心とCanvas中心のずれを補正
  var offsetX=(centerX - W/2)/vpZoom;
  var offsetY=(centerY - H/2)/vpZoom;
  vpPanX -= offsetX; vpPanY -= offsetY;
}

// ============================================================
// 描画
// ============================================================
function getCanvasWidth(canvasEl){
  var W=canvasEl.offsetWidth;
  if(!W||W<50) W=canvasEl.parentNode&&canvasEl.parentNode.offsetWidth;
  if(!W||W<50) W=window.innerWidth>100?window.innerWidth-64:300;
  return W;
}

function drawCanvas(canvasEl, anchors, isPreview, isPrint){
  var dpr=isPrint?1:(window.devicePixelRatio||1);
  var W, H;
  if(isPrint){
    // 印刷時：既にpx単位でサイズ設定済みなのでそのまま使う
    W=canvasEl.width; H=canvasEl.height;
  } else {
    W=getCanvasWidth(canvasEl);
    H=340;
    canvasEl.width=W*dpr; canvasEl.height=H*dpr;
  }
  var ctx=canvasEl.getContext("2d");
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#FAFAF8"; ctx.fillRect(0,0,W,H);

  // グリッド
  ctx.strokeStyle="#ECEAE4"; ctx.lineWidth=0.5;
  for(var gx=0;gx<W;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke();}
  for(var gy=0;gy<H;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

  if(!anchors||anchors.length===0) return;

  function wc(wx,wy){ return worldToCanvas(wx,wy,W,H); }

  function drawLabel(mx,my,text,color,bold){
    ctx.font=(bold?"bold ":"")+"16px monospace";
    ctx.textAlign="center";
    var tw=ctx.measureText(text).width;
    ctx.fillStyle="rgba(250,250,248,0.93)";
    ctx.fillRect(mx-tw/2-4,my-13,tw+8,18);
    ctx.fillStyle=color; ctx.fillText(text,mx,my+2);
  }

  // 線描画
  // 寸法ラベル表示済みの列・行・対角を記録（同じ寸法の重複ラベルを防ぐ）
  var shownColLabel={};  // key: c → 表示済みの寸法値
  var shownRowLabel={};  // key: r → 表示済みの寸法値
  var shownDiagLabel={}; // key: "c,r" → 表示済み

  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var a=anchors[r*cols+c], pa=wc(a.x,a.y);
      if(c+1<cols){
        var b=anchors[r*cols+c+1], pb=wc(b.x,b.y);
        var ok=!isNaN(parseFloat(colSpaces[c]))&&parseFloat(colSpaces[c])>0;
        var cl=ok?"#2563EB":"#CBD5E1";
        ctx.beginPath();ctx.moveTo(pa.cx,pa.cy);ctx.lineTo(pb.cx,pb.cy);
        ctx.strokeStyle=cl;ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();
        // 横寸法：同じ列間隔は一番上(r===0)のみ表示
        var colVal=ok?calcDist(a,b).toFixed(0):"タップ";
        if(r===0||(shownColLabel[c]===undefined)){
          drawLabel((pa.cx+pb.cx)/2,(pa.cy+pb.cy)/2-18,colVal,cl,ok);
          shownColLabel[c]=colVal;
        }
      }
      if(r+1<rows){
        var b2=anchors[(r+1)*cols+c], pb2=wc(b2.x,b2.y);
        var ok2=!isNaN(parseFloat(rowSpaces[r]))&&parseFloat(rowSpaces[r])>0;
        var cl2=ok2?"#2563EB":"#CBD5E1";
        ctx.beginPath();ctx.moveTo(pa.cx,pa.cy);ctx.lineTo(pb2.cx,pb2.cy);
        ctx.strokeStyle=cl2;ctx.lineWidth=2;ctx.setLineDash([]);ctx.stroke();
        // 縦寸法：一番右列(c===cols-1)のみ表示
        if(c===cols-1){
          var rowVal=ok2?calcDist(a,b2).toFixed(0):"タップ";
          drawLabel((pa.cx+pb2.cx)/2+20,(pa.cy+pb2.cy)/2,rowVal,cl2,ok2);
        }
      }
    }
  }

  // A1から全対角線（隣接含む・行・列が両方異なる全アンカーへ）
  // 距離が近い順にインデックスを付けて色を変える
  var DIAG_COLORS=["#E85D26","#D97706","#16A34A","#0891B2","#9333EA","#BE185D","#65A30D","#1D4ED8"];
  var a1=anchors[0], pa1=wc(a1.x,a1.y);
  // 対象アンカーを距離順にソート
  var diagTargets=[];
  for(var di=0;di<anchors.length;di++){
    var da=anchors[di];
    if(da.col===0||da.row===0) continue;
    var okA1D=true;
    for(var ci=0;ci<da.col;ci++){ var v=parseFloat(colSpaces[ci]); if(isNaN(v)||v<=0) okA1D=false; }
    for(var ri=0;ri<da.row;ri++){ var v=parseFloat(rowSpaces[ri]); if(isNaN(v)||v<=0) okA1D=false; }
    diagTargets.push({anchor:da, ok:okA1D, dist:okA1D?calcDist(a1,da):0});
  }
  diagTargets.sort(function(x,y){ return x.dist-y.dist; });

  for(var di=0;di<diagTargets.length;di++){
    var dt=diagTargets[di], da=dt.anchor;
    var pda=wc(da.x,da.y);
    var diagColor=dt.ok?DIAG_COLORS[di%DIAG_COLORS.length]:"#F4A882";
    ctx.beginPath();ctx.moveTo(pa1.cx,pa1.cy);ctx.lineTo(pda.cx,pda.cy);
    ctx.strokeStyle=diagColor;ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);
    if(dt.ok){
      var lx=(pa1.cx+pda.cx)/2, ly=(pa1.cy+pda.cy)/2;
      var angle=Math.atan2(pda.cy-pa1.cy, pda.cx-pa1.cx);
      var offset=18;
      // ラベルに終点名を付けて何の距離か明示
      drawLabel(lx+Math.sin(angle)*offset, ly-Math.cos(angle)*offset,
        da.name+":"+dt.dist.toFixed(0), diagColor, true);
    }
  }

  // 測定線
  if(measurePair&&measurePair.length===2){
    var ma=measurePair[0],mb=measurePair[1];
    var mpa=wc(ma.x,ma.y),mpb=wc(mb.x,mb.y);
    ctx.beginPath();ctx.moveTo(mpa.cx,mpa.cy);ctx.lineTo(mpb.cx,mpb.cy);
    ctx.strokeStyle="#7C3AED";ctx.lineWidth=2.5;ctx.setLineDash([7,4]);ctx.stroke();ctx.setLineDash([]);
    var mmx=(mpa.cx+mpb.cx)/2,mmy=(mpa.cy+mpb.cy)/2;
    var mt=ma.name+"↔"+mb.name+": "+calcDist(ma,mb).toFixed(1)+"mm";
    ctx.font="bold 15px monospace";ctx.textAlign="center";
    var mtw=ctx.measureText(mt).width;
    ctx.fillStyle="#7C3AED";
    ctx.beginPath();ctx.roundRect(mmx-mtw/2-8,mmy-16,mtw+16,24,5);ctx.fill();
    ctx.fillStyle="#fff";ctx.fillText(mt,mmx,mmy+4);
  }

  // アンカードット
  anchors.forEach(function(a){
    var p=wc(a.x,a.y);
    var isSel=selectedAnchors.some(function(s){return s.id===a.id;});
    var isMea=measurePair&&measurePair.some(function(s){return s.id===a.id;});
    var rad=isSel||isMea?11:9;
    ctx.beginPath();ctx.arc(p.cx,p.cy,rad,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.95)";ctx.fill();
    ctx.strokeStyle=isMea?"#7C3AED":isSel?"#F59E0B":(isPreview?"#CBD5E1":a.color);
    ctx.lineWidth=isSel||isMea?3:2;ctx.stroke();
    ctx.beginPath();ctx.arc(p.cx,p.cy,4,0,Math.PI*2);
    ctx.fillStyle=isMea?"#7C3AED":isSel?"#F59E0B":(isPreview?"#CBD5E1":a.color);ctx.fill();
    // 名前ラベル
    ctx.font="bold 15px monospace";ctx.textAlign="center";
    var lw=ctx.measureText(a.name).width;
    ctx.fillStyle="rgba(250,250,248,0.93)";ctx.fillRect(p.cx-lw/2-3,p.cy-rad-17,lw+6,17);
    ctx.fillStyle=isMea?"#7C3AED":isSel?"#F59E0B":(isPreview?"#8A8680":a.color);
    ctx.fillText(a.name,p.cx,p.cy-rad-3);
  });
}

// ============================================================
// ヒットテスト（ワールド座標で判定）
// ============================================================
function hitTest(canvasEl, clientX, clientY){
  var anchors=buildAnchors();
  if(!anchors.length) return;
  var rect=canvasEl.getBoundingClientRect();
  var cx=clientX-rect.left, cy=clientY-rect.top;
  var W=getCanvasWidth(canvasEl);
  var H=340;
  // クリック座標をワールド座標に変換
  var wpos=canvasToWorld(cx,cy,W,H);
  var wx=wpos.x, wy=wpos.y;

  // ヒット半径（ワールド座標換算）
  var HIT_A=16/vpZoom; // アンカー点
  var HIT_L=10/vpZoom; // 線

  // アンカー点優先
  for(var i=0;i<anchors.length;i++){
    var a=anchors[i];
    var d=Math.sqrt((wx-a.x)*(wx-a.x)+(wy-a.y)*(wy-a.y));
    if(d<=HIT_A){ onAnchorTap(a); return; }
  }
  // 線
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var a=anchors[r*cols+c];
      if(c+1<cols){
        var b=anchors[r*cols+c+1];
        if(ptSegDist(wx,wy,a.x,a.y,b.x,b.y)<=HIT_L){ onLineTap({type:"col",index:c}); return; }
      }
      if(r+1<rows){
        var b2=anchors[(r+1)*cols+c];
        if(ptSegDist(wx,wy,a.x,a.y,b2.x,b2.y)<=HIT_L){ onLineTap({type:"row",index:r}); return; }
      }
    }
  }
}

// ============================================================
// タップ処理
// ============================================================
function onAnchorTap(anchor){
  if(selectedAnchors.length===0){ selectedAnchors=[anchor]; }
  else if(selectedAnchors.length===1){
    if(selectedAnchors[0].id===anchor.id){ selectedAnchors=[]; }
    else { measurePair=[selectedAnchors[0],anchor]; selectedAnchors=[]; }
  } else { measurePair=null; selectedAnchors=[anchor]; }
  render();
}
function onLineTap(target){
  var current=target.type==="col"?colSpaces[target.index]:rowSpaces[target.index];
  selectedAnchors=[]; measurePair=null;
  openPopup(target,current||"");
}
function clearMeasure(){ selectedAnchors=[]; measurePair=null; render(); }

// ============================================================
// ポップアップ
// ============================================================
function openPopup(target,val){
  popupTarget=target;
  var label=target.type==="col"
    ? String.fromCharCode(65+target.index)+" ↔ "+String.fromCharCode(66+target.index)+" の横間隔"
    : "行"+(target.index+1)+" ↔ 行"+(target.index+2)+" の縦間隔";
  document.getElementById("popup-label").textContent=label;
  document.getElementById("popup-input").value=val;
  document.getElementById("popup-overlay").classList.remove("hidden");
  setTimeout(function(){ document.getElementById("popup-input").focus(); },200);
}
function closePopup(){
  if(popupTarget){
    var v=document.getElementById("popup-input").value;
    if(popupTarget.type==="col") colSpaces[popupTarget.index]=v;
    else rowSpaces[popupTarget.index]=v;
    confirmed=false;
  }
  popupTarget=null;
  document.getElementById("popup-overlay").classList.add("hidden");
  vpInited=false; // 間隔変わったのでfitし直す
  render();
}

// ============================================================
// 保存・読み込み・リセット
// ============================================================
var SAVE_KEY="anchor-calc-v1";

function saveData(){
  var data={cols:cols,rows:rows,colSpaces:colSpaces,rowSpaces:rowSpaces,confirmed:confirmed};
  try{
    localStorage.setItem(SAVE_KEY,JSON.stringify(data));
    showSaveMsg("✅ 保存しました","#16A34A");
  } catch(e){ showSaveMsg("❌ 保存に失敗しました","#E85D26"); }
}

function loadData(){
  try{
    var raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return false;
    var data=JSON.parse(raw);
    cols=data.cols||2; rows=data.rows||2;
    colSpaces=data.colSpaces||new Array(Math.max(0,cols-1)).fill("");
    rowSpaces=data.rowSpaces||new Array(Math.max(0,rows-1)).fill("");
    confirmed=data.confirmed||false;
    document.getElementById("cols-input").value=cols;
    document.getElementById("rows-input").value=rows;
    return true;
  } catch(e){ return false; }
}

function resetAll(){
  if(!confirm("全データをリセットしますか？")) return;
  try{ localStorage.removeItem(SAVE_KEY); } catch(e){}
  cols=2; rows=2;
  colSpaces=[""]; rowSpaces=[""];
  confirmed=false; selectedAnchors=[]; measurePair=null;
  vpInited=false; vpZoom=1; vpPanX=0; vpPanY=0;
  document.getElementById("cols-input").value=2;
  document.getElementById("rows-input").value=2;
  showSaveMsg("🗑 リセットしました","#8A8680");
  render();
}

function printPDF(){
  var anchors=buildAnchors();
  if(!isReady()||anchors.length<2){
    alert("全ての間隔を入力してから印刷してください");
    return;
  }

  // タイトルと日付（図ページ・表ページ両方）
  var titleText=cols+"列×"+rows+"行　アンカー距離計算";
  var dateText=new Date().toLocaleDateString("ja-JP");
  document.getElementById("print-title").textContent=titleText;
  document.getElementById("print-date").textContent=dateText;
  document.getElementById("print-title2").textContent=titleText;
  document.getElementById("print-date2").textContent=dateText;

  // 印刷用Canvas生成（アンカー配置の縦横比からサイズを決定・はみ出し防止）
  var pw=document.getElementById("print-canvas-wrap");
  pw.innerHTML="";
  var pc=document.createElement("canvas");
  var pxs=anchors.map(function(a){return a.x;}), pys=anchors.map(function(a){return a.y;});
  var prangeX=Math.max.apply(null,pxs)-Math.min.apply(null,pxs)||1;
  var prangeY=Math.max.apply(null,pys)-Math.min.apply(null,pys)||1;
  // 非対称パディング：右側に縦寸法ラベル分・上部に横寸法ラベル分を確保
  var PAD_L=20, PAD_R=55, PAD_T=35, PAD_B=8;
  var MAX_PW=620, MAX_PH=900;
  var drawMaxW=MAX_PW-PAD_L-PAD_R, drawMaxH=MAX_PH-PAD_T-PAD_B;
  var zx=drawMaxW/prangeX, zy=drawMaxH/prangeY;
  var pZoom=Math.min(zx,zy);
  var PW=Math.round(prangeX*pZoom+PAD_L+PAD_R);
  var PH=Math.round(prangeY*pZoom+PAD_T+PAD_B);
  PW=Math.max(PW,200); PH=Math.max(PH,200);
  pc.width=PW; pc.height=PH;
  pc.style.width=PW+"px"; pc.style.height=PH+"px";
  pw.appendChild(pc);

  // 印刷用viewportでfit描画（非対称パディング対応）
  var origZoom=vpZoom, origPanX=vpPanX, origPanY=vpPanY;
  fitViewportForPrint(anchors, PW, PH, PAD_L, PAD_R, PAD_T, PAD_B);
  drawCanvas(pc, anchors, false, true);
  vpZoom=origZoom; vpPanX=origPanX; vpPanY=origPanY;

  // 印刷用テーブル生成
  var tw=document.getElementById("print-table-wrap");
  var tbl=document.createElement("table");
  tbl.style.cssText="border-collapse:collapse;width:100%;font-size:12px;font-family:monospace";
  var thead='<thead><tr><th style="background:#f5f5f5;border:1px solid #ccc;padding:5px 7px">-</th>';
  anchors.forEach(function(a){ thead+='<th style="background:#f5f5f5;border:1px solid #ccc;padding:5px 7px;color:'+a.color+'">'+a.name+'</th>'; });
  thead+='</tr></thead>';
  var tbody='<tbody>';
  anchors.forEach(function(rA){
    tbody+='<tr><th style="background:#f5f5f5;border:1px solid #ccc;padding:5px 7px;color:'+rA.color+'">'+rA.name+'</th>';
    anchors.forEach(function(cA){
      if(rA.id===cA.id){ tbody+='<td style="border:1px solid #ccc;padding:5px 7px;text-align:center;color:#aaa">—</td>'; }
      else {
        var isDiag=(rA.col!==cA.col&&rA.row!==cA.row);
        var style="border:1px solid #ccc;padding:5px 7px;text-align:center;"+(isDiag?"color:#E85D26;font-weight:700":"color:#1A1A1A");
        tbody+='<td style="'+style+'">'+calcDist(rA,cA).toFixed(1)+'</td>';
      }
    });
    tbody+='</tr>';
  });
  tbody+='</tbody>';
  tbl.innerHTML=thead+tbody;
  tw.innerHTML='<p style="font-size:11px;color:#666;margin-bottom:4px">※ オレンジ色が対角距離</p>';
  tw.appendChild(tbl);

  // 印刷エリアを表示してprint
  var printArea=document.getElementById("print-area");
  printArea.style.display="block";
  setTimeout(function(){
    window.print();
    setTimeout(function(){ printArea.style.display="none"; },500);
  },300);
}


function showSaveMsg(msg, color){
  var el=document.getElementById("save-msg");
  el.textContent=msg; el.style.color=color;
  el.classList.remove("hidden");
  setTimeout(function(){ el.classList.add("hidden"); },2000);
}


function buildTextInputs(){
  var container=document.getElementById("text-inputs");
  var html="";
  if(cols>1){
    html+='<div class="space-group"><span class="space-group-title">横方向の間隔</span>';
    for(var i=0;i<cols-1;i++)
      html+='<div class="space-item"><label>'+String.fromCharCode(65+i)+' ↔ '+String.fromCharCode(66+i)+'</label>'
        +'<input type="number" inputmode="decimal" placeholder="例: 500" data-type="col" data-index="'+i+'" value="'+(colSpaces[i]||"")+'"></div>';
    html+='</div>';
  }
  if(rows>1){
    html+='<div class="space-group"><span class="space-group-title">縦方向の間隔</span>';
    for(var j=0;j<rows-1;j++)
      html+='<div class="space-item"><label>行'+(j+1)+' ↔ 行'+(j+2)+'</label>'
        +'<input type="number" inputmode="decimal" placeholder="例: 300" data-type="row" data-index="'+j+'" value="'+(rowSpaces[j]||"")+'"></div>';
    html+='</div>';
  }
  if(cols===1&&rows===1) html='<p style="color:var(--muted);font-size:13px">アンカー1本のため不要です</p>';
  container.innerHTML=html;
  container.querySelectorAll("input").forEach(function(inp){
    inp.addEventListener("input",function(){
      var t=this.getAttribute("data-type"),idx=parseInt(this.getAttribute("data-index"));
      if(t==="col") colSpaces[idx]=this.value; else rowSpaces[idx]=this.value;
      confirmed=false;
    });
    inp.addEventListener("blur",function(){ vpInited=false; render(); });
  });
}

// ============================================================
// 距離表
// ============================================================
function buildTable(anchors){
  var html='<thead><tr><th>-</th>';
  anchors.forEach(function(a){ html+='<th style="color:'+a.color+'">'+a.name+'</th>'; });
  html+='</tr></thead><tbody>';
  anchors.forEach(function(rA,i){
    html+='<tr><th style="color:'+rA.color+'">'+rA.name+'</th>';
    anchors.forEach(function(cA,j){
      if(i===j){ html+='<td class="self">—</td>'; }
      else {
        var isDiag=(rA.col!==cA.col && rA.row!==cA.row);
        html+='<td class="'+(isDiag?"diag":"")+'">'+calcDist(rA,cA).toFixed(1)+'</td>';
      }
    });
    html+='</tr>';
  });
  html+='</tbody>';
  document.getElementById("dist-table").innerHTML=html;
}

// ============================================================
// レンダー
// ============================================================
function render(){
  var anchors=buildAnchors();
  var ready=isReady();
  var isPrev=!confirmed||!ready;
  var canvasEl=document.getElementById("canvas-2");
  var W=getCanvasWidth(canvasEl);
  var H=340;

  document.getElementById("total-count").textContent=cols*rows;
  document.getElementById("preview-hint").classList.toggle("hidden",!isPrev);
  document.getElementById("canvas-container-2").className="canvas-container"+(isPrev?" preview":"");

  // 初回またはリセット時にfitする
  if(!vpInited){ fitViewport(anchors,W,H); vpInited=true; }

  drawCanvas(canvasEl,anchors,isPrev);

  var mb2=document.getElementById("measure-banner-2");
  if(measurePair){
    mb2.classList.remove("hidden");
    document.getElementById("measure-text-2").textContent=
      measurePair[0].name+" ↔ "+measurePair[1].name+"："+calcDist(measurePair[0],measurePair[1]).toFixed(1)+" mm";
  } else { mb2.classList.add("hidden"); }

  var sh2=document.getElementById("select-hint-2");
  if(selectedAnchors.length===1){ sh2.classList.remove("hidden"); document.getElementById("select-name-2").textContent=selectedAnchors[0].name; }
  else { sh2.classList.add("hidden"); }

  var det=document.getElementById("text-details");
  var activeEl=document.activeElement;
  var focusedInText=activeEl&&activeEl.closest&&activeEl.closest("#text-inputs");
  if(det.open&&!focusedInText) buildTextInputs();

  document.getElementById("calc-btn").classList.toggle("hidden",!ready||confirmed);

  var step3=document.getElementById("step3");
  if(ready&&anchors.length>=2){ step3.classList.remove("hidden"); buildTable(anchors); }
  else { step3.classList.add("hidden"); }
}

// ============================================================
// 初期化（イベント登録1回のみ）
// ============================================================
(function(){

  function setupCanvas(id){
    var el=document.getElementById(id);
    var sx,sy,lastPinchDist,lastPinchMidX,lastPinchMidY;
    var touchStartTime=0, isTap=false;

    function getDist(t1,t2){
      var dx=t1.clientX-t2.clientX,dy=t1.clientY-t2.clientY;
      return Math.sqrt(dx*dx+dy*dy);
    }
    function getMid(t1,t2){
      return {x:(t1.clientX+t2.clientX)/2, y:(t1.clientY+t2.clientY)/2};
    }

    el.addEventListener("touchstart",function(e){
      e.preventDefault();
      if(e.touches.length===1){
        // 2本指→1本指になった直後はwasPinchingのままにする
        if(!wasPinching){
          sx=e.touches[0].clientX; sy=e.touches[0].clientY;
          touchStartTime=Date.now(); isTap=true;
        }
        lastPinchDist=null;
      } else if(e.touches.length===2){
        isTap=false;
        wasPinching=true;
        lastPinchDist=getDist(e.touches[0],e.touches[1]);
        var mid=getMid(e.touches[0],e.touches[1]);
        lastPinchMidX=mid.x; lastPinchMidY=mid.y;
      }
    },{passive:false});

    el.addEventListener("touchmove",function(e){
      e.preventDefault();
      if(e.touches.length===2){
        var d=getDist(e.touches[0],e.touches[1]);
        var mid=getMid(e.touches[0],e.touches[1]);
        if(lastPinchDist&&lastPinchDist>0){
          var ratio=d/lastPinchDist;
          var rect=el.getBoundingClientRect();
          var W=getCanvasWidth(el);
          var H=340;
          // ピンチ中心点（前回）のワールド座標を固定してズーム
          var pinchCx=lastPinchMidX-rect.left, pinchCy=lastPinchMidY-rect.top;
          var wBefore=canvasToWorld(pinchCx,pinchCy,W,H);
          vpZoom=Math.max(0.05,Math.min(20,vpZoom*ratio));
          var wAfter=canvasToWorld(pinchCx,pinchCy,W,H);
          vpPanX-=wAfter.x-wBefore.x;
          vpPanY-=wAfter.y-wBefore.y;
          // ピンチ中心の移動分もパンに反映
          var dMidX=mid.x-lastPinchMidX, dMidY=mid.y-lastPinchMidY;
          vpPanX-=dMidX/vpZoom; vpPanY-=dMidY/vpZoom;
          drawCanvas(el,buildAnchors(),!confirmed||!isReady());
        }
        lastPinchDist=d;
        lastPinchMidX=mid.x; lastPinchMidY=mid.y;
        isTap=false;
      } else if(e.touches.length===1&&!wasPinching){
        // 1本指パン（ピンチ直後は無視）
        var dx=e.touches[0].clientX-sx, dy=e.touches[0].clientY-sy;
        if(Math.abs(dx)>4||Math.abs(dy)>4){
          vpPanX-=dx/vpZoom; vpPanY-=dy/vpZoom;
          sx=e.touches[0].clientX; sy=e.touches[0].clientY;
          drawCanvas(el,buildAnchors(),!confirmed||!isReady());
          isTap=false;
        }
      }
    },{passive:false});

    var lastTap=0;
    var wasPinching=false;
    el.addEventListener("touchend",function(e){
      e.preventDefault();

      if(e.touches.length<2) lastPinchDist=null;

      // 両指が離れたらwasPinchingを解除、lastTapもリセットして誤ダブルタップ防止
      if(e.touches.length===0){
        if(wasPinching){
          wasPinching=false;
          lastTap=0;
          isTap=false;
          return;
        }
      } else {
        // まだ指が残っている＝ピンチ中
        isTap=false;
        return;
      }

      var now=Date.now();
      if(isTap&&e.changedTouches.length===1){
        var t=e.changedTouches[0];
        var moved=Math.abs(t.clientX-sx)>8||Math.abs(t.clientY-sy)>8;
        var quick=(now-touchStartTime)<300;
        if(!moved&&quick){
          if((now-lastTap)<300&&lastTap>0){
            vpInited=false; render();
            lastTap=0;
          } else {
            hitTest(el,t.clientX,t.clientY);
            lastTap=now;
          }
        }
      }
      isTap=false;
    },{passive:false});

    // PC用マウス
    el.addEventListener("click",function(e){ hitTest(el,e.clientX,e.clientY); });
  }

  setupCanvas("canvas-2");

  // アンカー数
  document.getElementById("cols-input").addEventListener("blur",function(){
    var n=parseInt(this.value);
    if(!isNaN(n)){
      var newCols=Math.max(1,Math.min(10,n));
      this.value=newCols;
      if(newCols!==cols){
        cols=newCols;
        colSpaces=new Array(Math.max(0,cols-1)).fill("");
        confirmed=false; selectedAnchors=[]; measurePair=null; vpInited=false;
        render();
      }
    } else { this.value=cols; }
  });
  document.getElementById("rows-input").addEventListener("blur",function(){
    var n=parseInt(this.value);
    if(!isNaN(n)){
      var newRows=Math.max(1,Math.min(10,n));
      this.value=newRows;
      if(newRows!==rows){
        rows=newRows;
        rowSpaces=new Array(Math.max(0,rows-1)).fill("");
        confirmed=false; selectedAnchors=[]; measurePair=null; vpInited=false;
        render();
      }
    } else { this.value=rows; }
  });

  document.getElementById("calc-btn").addEventListener("click",function(){ confirmed=true; render(); });
  document.getElementById("clear-btn-2").addEventListener("click",clearMeasure);
  document.getElementById("popup-ok").addEventListener("click",closePopup);
  document.getElementById("popup-input").addEventListener("keydown",function(e){ if(e.key==="Enter") closePopup(); });
  document.getElementById("popup-overlay").addEventListener("click",function(e){ if(e.target===this) closePopup(); });
  document.getElementById("text-details").addEventListener("toggle",function(){ if(this.open) buildTextInputs(); });
  document.getElementById("save-btn").addEventListener("click",saveData);
  document.getElementById("reset-btn").addEventListener("click",resetAll);
  document.getElementById("print-btn").addEventListener("click",printPDF);

  // 起動時に保存データを読み込む
  loadData();

  // content://プロトコル対応：Canvasコンテナの幅が確定してから初回描画
  // ResizeObserverで幅確定を検知し、確定したら即描画（1回だけ）
  var container=document.getElementById("canvas-container-2");
  var initDone=false;
  function doInitRender(){
    if(initDone) return;
    var W=getCanvasWidth(document.getElementById("canvas-2"));
    if(W>=50){
      initDone=true;
      render();
    }
  }
  if(typeof ResizeObserver!=="undefined"){
    var ro=new ResizeObserver(function(){
      doInitRender();
    });
    ro.observe(container);
    // フォールバック：200ms後にも試みる
    setTimeout(doInitRender, 200);
  } else {
    // ResizeObserver非対応ブラウザ用フォールバック
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ render(); });
    });
  }
})();
